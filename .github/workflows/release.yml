# Publishes the contract version as a GitHub release (and its tag) when a
# version that isn't released yet reaches main. The version is
# contracts.Version in registry.go; the notes are its CHANGELOG.md section.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish the version, if it isn't yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' registry.go)
          if [ -z "$version" ]; then echo "no Version in registry.go"; exit 1; fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          notes=$(awk -v head="## $tag" 'index($0, head) == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "${notes:-Contract $tag}"
          echo "published $tag"
