syntax = "proto3";

// securebrand.coverage.v1: what each collection job did and didn't get, and
// why. Per-item coverage is on content.v1.Post (ItemCoverage).
package securebrand.coverage.v1;

import "google/protobuf/timestamp.proto";
import "securebrand/content/v1/common.proto";

option go_package = "github.com/abdullah95k/securebrand-contracts/gen/go/securebrand/coverage/v1;coveragev1";

// JobCoverage is published once per finished job (topic
// collection.coverage.v1, key: the job ID).
message JobCoverage {
  string event_id = 1;
  string platform = 2;
  string collector = 3;
  string job_id = 4;
  JobKind kind = 5;
  JobStatus status = 6;
  // The account the job was about, and the reference it was asked for.
  string subject_id = 7;
  string subject_ref = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  // The content window it covered.
  google.protobuf.Timestamp window_from = 11;
  google.protobuf.Timestamp window_to = 12;
  // Counters: shared keys (requests, bytes, posts, comments, replies,
  // blocked, page_loads) and platform keys ("<platform>.<name>").
  map<string, int64> counters = 13;
  Completeness completeness = 14;
  repeated Reason reasons = 15;
  securebrand.content.v1.Provenance provenance = 16;
}

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_SCHEDULED = 1;
  JOB_KIND_BACKFILL = 2;
  JOB_KIND_ON_DEMAND = 3;
  JOB_KIND_REFRESH = 4;
  JOB_KIND_DISCOVERY_CHECK = 5;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_COMPLETED = 1;
  JOB_STATUS_PARTIAL = 2;
  JOB_STATUS_FAILED = 3;
  JOB_STATUS_CANCELLED = 4;
}

message Completeness {
  int64 posts = 1;
  int64 posts_complete = 2;
  int64 posts_truncated = 3;
  optional double median_ratio = 4;
  optional double min_ratio = 5;
  int64 comments_reported = 6;
  int64 comments_collected = 7;
}

// Reason is a class of missing data, with how often it happened: wall,
// private, removed, limit, rate_limited, parse_error, login_required.
message Reason {
  string class = 1;
  int64 count = 2;
  string detail = 3;
}
